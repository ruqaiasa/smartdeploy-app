server:
  port: 8081

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/smartdeploy_db}
    username: ${DB_USERNAME:smartdeploy_user}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expiration: 3600000
    refresh-expiration: 604800000

smartdeploy:
  jenkins:
    url: ${JENKINS_URL:http://192.168.85.129:8080}
    username: ${JENKINS_USERNAME:admin}
    token: ${JENKINS_API_TOKEN}
    job-name: ${JENKINS_JOB_NAME:smartdeploy}
    # Clé partagée Jenkins ↔ SmartDeploy (credential Jenkins "smartdeploy-api-key").
    # Obligatoire, sans valeur par défaut : export des manifests + webhook.
    api-key: ${SMARTDEPLOY_JENKINS_API_KEY}
  notifications:
    slack:
      # Webhook entrant Slack : secret, à placer dans .env. Vide = notifications désactivées.
      webhook-url: ${SMARTDEPLOY_SLACK_WEBHOOK_URL:}
      # Actions notifiées (liste séparée par des virgules), voir SlackNotifier.DEFAULT_ACTIONS.
      actions: ${SMARTDEPLOY_SLACK_ACTIONS:DEPLOYMENT_SUCCEEDED,DEPLOYMENT_FAILED,DEPLOYMENT_ROLLBACK_REQUESTED,DEPLOYMENT_EXPIRED,SUSPICIOUS_ACTIVITY,USER_ROLE_CHANGED,ALERT_OPENED,ALERT_RESOLVED,GUARD_DEGRADED,GUARD_AUTO_ROLLBACK,INCIDENT_ANALYZED}
  # Gardien de déploiement : surveillance après chaque mise en service.
  guard:
    enabled: ${SMARTDEPLOY_GUARD_ENABLED:true}
    window-minutes: ${SMARTDEPLOY_GUARD_WINDOW_MINUTES:10}
    baseline-minutes: 15
    critical-confirmations: 2
    # Retour arrière automatique en cas de dégradation (ailleurs, il est seulement proposé).
    auto-rollback-environments: ${SMARTDEPLOY_AUTO_ROLLBACK_ENVIRONMENTS:DEVELOPMENT,TEST}
    interval-ms: 30000
  # Adresse de l'interface, utilisée pour les liens dans les notifications.
  app-url: ${SMARTDEPLOY_APP_URL:http://localhost:5173}

prometheus:
  url: ${PROMETHEUS_URL:http://192.168.85.129:30090}