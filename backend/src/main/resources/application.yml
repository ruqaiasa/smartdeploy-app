server:
  port: 8081

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/smartdeploy_db}
    username: ${DB_USERNAME:smartdeploy_user}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

  # E-mails : Mailpit en développement (smtp localhost:1025, page web http://localhost:8025)
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expiration: 3600000
    refresh-expiration: 604800000

smartdeploy:
  # Adresse du frontend, pour les liens envoyés par e-mail
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # Adresse publique automatique de chaque environnement (vide : désactivée)
  ingress:
    auto-domain: ${INGRESS_AUTO_DOMAIN:192.168.85.129.nip.io}
  # Premier démarrage : administrateur initial, créé seulement s'il n'existe aucun administrateur
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
  # Courriels des nouveaux comptes (confirmation, activation, refus) : vrai serveur SMTP.
  # Sans ACCOUNT_SMTP_HOST, ils partent vers le serveur interne (Mailpit).
  account-mail:
    host: ${ACCOUNT_SMTP_HOST:}
    port: ${ACCOUNT_SMTP_PORT:587}
    username: ${ACCOUNT_SMTP_USERNAME:}
    password: ${ACCOUNT_SMTP_PASSWORD:}
    from: ${ACCOUNT_MAIL_FROM:}
  mail:
    from: ${SMARTDEPLOY_MAIL_FROM:SmartDeploy <no-reply@smartdeploy.local>}
  password-reset:
    ttl-minutes: 30
  # Approbation avant la production : types d'environnement concernés, délai de réponse
  approval:
    environment-types: ${SMARTDEPLOY_APPROVAL_TYPES:PRODUCTION}
    timeout-hours: 24
  # Promotion entre environnements : types où une validation préalable par le gardien est exigée
  promotion:
    required-for: ${SMARTDEPLOY_PROMOTION_REQUIRED_FOR:PRODUCTION}
  # Accès au cluster Kubernetes (compte de service smartdeploy-backend)
  kubernetes:
    master-url: ${SMARTDEPLOY_K8S_URL:https://192.168.85.129:6443}
    token-path: ${SMARTDEPLOY_K8S_TOKEN_PATH:C:/smartdeploy-k8s/smartdeploy-token}
    ca-path: ${SMARTDEPLOY_K8S_CA_PATH:C:/smartdeploy-k8s/smartdeploy-ca.crt}
  # Sauvegarde de la base de SmartDeploy (pg_dump depuis le conteneur Docker)
  platform-backup:
    enabled: ${SMARTDEPLOY_PLATFORM_BACKUP_ENABLED:true}
    cron: "0 30 2 * * *"
    container: ${SMARTDEPLOY_DB_CONTAINER:smartdeploy-postgres}
    database: ${SMARTDEPLOY_DB_NAME:smartdeploy_db}
    directory: ${SMARTDEPLOY_PLATFORM_BACKUP_DIR:${user.home}/smartdeploy-sauvegardes}
    retention: 7
    # Adresse SAS d'un conteneur Azure (facultative) : https://<compte>.blob.core.windows.net/<conteneur>?<jeton>
    azure-container-sas-url: ${SMARTDEPLOY_PLATFORM_BACKUP_SAS_URL:}
  jenkins:
    url: ${JENKINS_URL:http://192.168.85.129:8080}
    username: ${JENKINS_USERNAME:admin}
    token: ${JENKINS_API_TOKEN}
    job-name: ${JENKINS_JOB_NAME:smartdeploy}
    # Clé partagée Jenkins ↔ SmartDeploy (credential Jenkins "smartdeploy-api-key").
    # Obligatoire, sans valeur par défaut : export des manifests + webhook.
    api-key: ${SMARTDEPLOY_JENKINS_API_KEY}
  notifications:
    slack:
      # Webhook entrant Slack : secret, à placer dans .env. Vide = notifications désactivées.
      webhook-url: ${SMARTDEPLOY_SLACK_WEBHOOK_URL:}
      # Actions notifiées (liste séparée par des virgules), voir SlackNotifier.DEFAULT_ACTIONS.
      actions: ${SMARTDEPLOY_SLACK_ACTIONS:DEPLOYMENT_SUCCEEDED,DEPLOYMENT_FAILED,DEPLOYMENT_ROLLBACK_REQUESTED,DEPLOYMENT_EXPIRED,SUSPICIOUS_ACTIVITY,USER_ROLE_CHANGED,ALERT_OPENED,ALERT_RESOLVED,GUARD_DEGRADED,GUARD_AUTO_ROLLBACK,INCIDENT_ANALYZED,BACKUP_FAILED,RESTORE_STARTED,RESTORE_COMPLETED,RESTORE_FAILED,RAID_DEGRADED,RAID_RECOVERING,RAID_RESTORED,DEPLOYMENT_APPROVAL_REQUESTED,DEPLOYMENT_APPROVED,DEPLOYMENT_REJECTED,DEPLOYMENT_APPROVAL_EXPIRED,DEPLOYMENT_EMERGENCY_OVERRIDE,BACKUP_PROTECTION_DEGRADED,BACKUP_PROTECTION_RESTORED,BACKUP_STORAGE_UNAVAILABLE,BACKUP_STORAGE_AVAILABLE,PLATFORM_BACKUP_FAILED,RESTORE_VERIFIED,RESTORE_UNHEALTHY,STORAGE_SPACE_LOW,STORAGE_SPACE_CRITICAL,STORAGE_SPACE_OK}
  # Gardien de déploiement : surveillance après chaque mise en service.
  guard:
    enabled: ${SMARTDEPLOY_GUARD_ENABLED:true}
    window-minutes: ${SMARTDEPLOY_GUARD_WINDOW_MINUTES:10}
    baseline-minutes: 15
    critical-confirmations: 2
    # Retour arrière automatique en cas de dégradation (ailleurs, il est seulement proposé).
    auto-rollback-environments: ${SMARTDEPLOY_AUTO_ROLLBACK_ENVIRONMENTS:DEVELOPMENT,TEST}
    interval-ms: 30000
  # Sauvegardes Velero : point de restauration avant chaque déploiement.
  velero:
    enabled: ${SMARTDEPLOY_VELERO_ENABLED:true}
    namespace: velero
    restore-point-before-deployment: ${SMARTDEPLOY_RESTORE_POINT:true}
    restore-point-timeout-seconds: 600
    restore-point-ttl: 72h0m0s
    manual-backup-ttl: 168h0m0s
  # Adresse de l'interface, utilisée pour les liens dans les notifications.
  app-url: ${SMARTDEPLOY_APP_URL:http://localhost:5173}

prometheus:
  url: ${PROMETHEUS_URL:http://192.168.85.129:30090}